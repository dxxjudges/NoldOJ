name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Unit & database tests
        run: npm test

  blackbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 黑盒测试需要验证码接口返回答案以便自动登录；仅测试环境使用，禁止生产设置
      NoldOJ_CAPTCHA_DEBUG: '1'
      # 全新 runner 上数据库首次初始化会生成随机管理员口令，测试硬编码 admin/admin123，
      # 因此显式指定初始口令；不设置时仍为随机口令（生产行为不变）
      NoldOJ_INIT_ADMIN_PASSWORD: 'admin123'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          node src/server.js > /tmp/noldoj-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/v1/health > /dev/null || { echo "server failed to start"; cat /tmp/noldoj-server.log; exit 1; }

      - name: Black-box security & login tests
        run: npm run test:server

      - name: Server log
        if: always()
        run: cat /tmp/noldoj-server.log || true

  windows-sandbox:
    # Windows 专属沙箱路径此前从未进 CI（ubuntu-latest 只走 Linux 传统回退路径）。
    # 本 job：编译 sandbox_runner.exe → 跑真实沙箱单测 → P0-1 workDir/meta 冒烟 → Windows 黑盒登录测试。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    env:
      NoldOJ_CAPTCHA_DEBUG: '1'
      NoldOJ_INIT_ADMIN_PASSWORD: 'admin123'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Ensure MinGW (g++)
        shell: pwsh
        run: |
          if (-not (Get-Command g++ -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
          }
          g++ --version

      - name: Build sandbox_runner.exe
        shell: cmd
        run: sandbox\build.bat

      - name: Install dependencies
        run: npm ci

      - name: Unit & database tests (real sandbox path)
        run: npm test

      - name: P0-1 sandbox workDir/meta smoke test
        shell: bash
        run: node --test test/sandbox-runner-smoke.test.js

      - name: Start server
        shell: bash
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/v1/health > /dev/null || { echo "server failed to start"; cat server.log; exit 1; }

      - name: Black-box security & login tests
        shell: bash
        run: npm run test:server

      - name: Server log
        if: always()
        shell: bash
        run: cat server.log || true
