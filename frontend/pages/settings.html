<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访问令牌 - NoldOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">访问令牌</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
      私人令牌可当作 access token 使用：在请求头中携带
      <code class="px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300">Authorization: Bearer &lt;令牌&gt;</code>
      即可调用 API。令牌只在创建时显示一次，请妥善保存。
    </p>

    <div id="createdBox" class="hidden mb-6 rounded-2xl border border-amber-300 bg-amber-50 dark:bg-amber-900/20 dark:border-amber-700 p-4">
      <p class="text-sm font-semibold text-amber-800 dark:text-amber-200 mb-2">令牌已创建，请立即复制保存（离开后无法再次查看）</p>
      <div class="flex gap-2">
        <input id="createdToken" readonly class="flex-1 px-3 py-2 rounded-xl border border-amber-300 dark:border-amber-700 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-mono text-xs">
        <button type="button" onclick="copyCreatedToken()" class="px-4 py-2 rounded-xl bg-amber-600 text-white text-sm hover:bg-amber-700">复制</button>
      </div>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-gray-900 dark:text-white">创建新令牌</h2>
        <button id="toggleCreate" type="button" onclick="toggleCreateForm()" class="text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">展开</button>
      </div>
      <form id="createForm" class="hidden space-y-4" onsubmit="return createToken(event)">
        <div>
          <label for="tokenName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">名称</label>
          <input id="tokenName" maxlength="50" required placeholder="例如：本地 CLI" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white">
        </div>
        <div>
          <label for="tokenExpiry" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">有效期</label>
          <select id="tokenExpiry" onchange="onExpiryChange()" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white">
            <option value="7">7 天</option>
            <option value="30" selected>30 天</option>
            <option value="90">90 天</option>
            <option value="180">180 天</option>
            <option value="365">365 天</option>
            <option value="custom">自定义天数</option>
            <option value="0">永久有效</option>
          </select>
          <div id="customDaysWrap" class="hidden mt-2">
            <input id="customDays" type="number" min="1" max="3650" placeholder="1 - 3650 天" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white">
          </div>
        </div>
        <div>
          <span class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">权限范围</span>
          <div class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
            <label class="flex items-start gap-2"><input type="checkbox" name="scope" value="read" checked class="mt-1"><span><b>读取数据</b><span class="text-xs text-gray-400 dark:text-gray-500">（所有 GET 接口）</span></span></label>
            <label class="flex items-start gap-2"><input type="checkbox" name="scope" value="submit" checked class="mt-1"><span><b>提交代码 / 运行 IDE</b><span class="text-xs text-gray-400 dark:text-gray-500">（提交、评测、IDE 运行与试卷提交）</span></span></label>
            <label class="flex items-start gap-2"><input type="checkbox" name="scope" value="write" class="mt-1"><span><b>修改业务数据</b><span class="text-xs text-gray-400 dark:text-gray-500">（文章、讨论、私信、题单、比赛等写操作）</span></span></label>
            <label class="flex items-start gap-2"><input type="checkbox" name="scope" value="account" class="mt-1"><span><b>账户设置</b><span class="text-xs text-gray-400 dark:text-gray-500">（修改个人资料；令牌管理仅限登录会话）</span></span></label>
          </div>
        </div>
        <div class="flex justify-end">
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-xl hover:bg-indigo-700">创建令牌</button>
        </div>
      </form>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6">
      <h2 class="font-semibold text-gray-900 dark:text-white mb-4">我的令牌</h2>
      <div id="tokenList" aria-live="polite" class="text-sm text-gray-400 dark:text-gray-500">加载中...</div>
    </div>
  </div>

  <script>
    document.getElementById('nav').innerHTML = renderNav('settings');

    if (!getUser()) {
      window.location.href = '/pages/login.html';
    }

    const SCOPE_LABELS = {
      read: '读取',
      submit: '提交',
      write: '修改',
      account: '账户'
    };

    function parseUtc(value) {
      if (!value) return null;
      const ms = Date.parse(String(value).replace(' ', 'T') + 'Z');
      return Number.isFinite(ms) ? ms : null;
    }

    function formatTime(value) {
      const ms = parseUtc(value);
      return ms === null ? '—' : new Date(ms).toLocaleString();
    }

    function expiryBadge(token) {
      if (token.permanent) {
        return '<span class="px-2 py-0.5 rounded-full text-xs bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300">永久</span>';
      }
      const ms = parseUtc(token.expires_at);
      if (ms === null) return '<span class="px-2 py-0.5 rounded-full text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">未知</span>';
      const diff = ms - Date.now();
      if (diff <= 0) {
        return '<span class="px-2 py-0.5 rounded-full text-xs bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300">已过期</span>';
      }
      const days = Math.ceil(diff / 86400000);
      return `<span class="px-2 py-0.5 rounded-full text-xs bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300">剩余 ${days} 天</span>`;
    }

    function scopeBadges(scopes) {
      return (scopes || []).map(s =>
        `<span class="px-1.5 py-0.5 rounded text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">${escapeHtml(SCOPE_LABELS[s] || s)}</span>`
      ).join(' ');
    }

    async function loadTokens() {
      const box = document.getElementById('tokenList');
      try {
        const data = await apiCall('GET', '/users/me/tokens');
        const tokens = data.tokens || [];
        if (tokens.length === 0) {
          box.innerHTML = '<p class="text-gray-400 dark:text-gray-500">还没有创建任何令牌。</p>';
          return;
        }
        box.innerHTML = tokens.map(t => `
          <div class="border border-gray-100 dark:border-gray-700 rounded-xl p-4 mb-3">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-semibold text-gray-900 dark:text-white break-all">${escapeHtml(t.name)}</span>
                  ${expiryBadge(t)}
                </div>
                <div class="mt-1 text-xs text-gray-400 dark:text-gray-500 font-mono break-all">${escapeHtml(t.prefix)}…</div>
                <div class="mt-2 flex flex-wrap gap-1">${scopeBadges(t.scopes)}</div>
                <div class="mt-2 text-xs text-gray-400 dark:text-gray-500">
                  创建于 ${escapeHtml(formatTime(t.created_at))} ｜ 最后使用 ${escapeHtml(formatTime(t.last_used_at))}
                </div>
              </div>
              <button type="button" onclick="revokeToken(${t.id})" class="shrink-0 px-3 py-1.5 text-xs rounded-lg border border-red-300 dark:border-red-700 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">吊销</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        box.innerHTML = `<p class="text-red-500">加载失败：${escapeHtml(e.message || '未知错误')}</p>`;
      }
    }

    function toggleCreateForm() {
      const form = document.getElementById('createForm');
      const btn = document.getElementById('toggleCreate');
      form.classList.toggle('hidden');
      btn.textContent = form.classList.contains('hidden') ? '展开' : '收起';
    }

    function onExpiryChange() {
      const value = document.getElementById('tokenExpiry').value;
      document.getElementById('customDaysWrap').classList.toggle('hidden', value !== 'custom');
    }

    async function createToken(event) {
      event.preventDefault();
      const name = document.getElementById('tokenName').value.trim();
      if (!name) { showToast('请填写令牌名称', 'error'); return false; }

      const expiry = document.getElementById('tokenExpiry').value;
      let days;
      if (expiry === 'custom') {
        days = Number(document.getElementById('customDays').value);
        if (!Number.isInteger(days) || days < 1 || days > 3650) {
          showToast('自定义天数需为 1 - 3650 的整数', 'error');
          return false;
        }
      } else {
        days = Number(expiry);
      }

      const scopes = Array.from(document.querySelectorAll('input[name="scope"]:checked')).map(i => i.value);
      if (scopes.length === 0) {
        showToast('请至少选择一项权限', 'error');
        return false;
      }

      try {
        const data = await apiCall('POST', '/users/me/tokens', { name, expires_in_days: days, scopes });
        document.getElementById('createdToken').value = data.token;
        document.getElementById('createdBox').classList.remove('hidden');
        document.getElementById('createForm').reset();
        document.getElementById('customDaysWrap').classList.add('hidden');
        showToast('令牌创建成功', 'success');
        loadTokens();
      } catch (e) {
        showToast(e.message || '创建失败', 'error');
      }
      return false;
    }

    async function copyCreatedToken() {
      const input = document.getElementById('createdToken');
      try {
        await navigator.clipboard.writeText(input.value);
        showToast('已复制到剪贴板', 'success');
      } catch {
        input.select();
        document.execCommand('copy');
        showToast('已复制到剪贴板', 'success');
      }
    }

    async function revokeToken(id) {
      if (!confirm('确定吊销该令牌？吊销后使用它的脚本会立即失效。')) return;
      try {
        await apiCall('DELETE', `/users/me/tokens/${id}`);
        showToast('令牌已吊销', 'success');
        loadTokens();
      } catch (e) {
        showToast(e.message || '吊销失败', 'error');
      }
    }

    loadTokens();
  </script>
</body>
</html>
