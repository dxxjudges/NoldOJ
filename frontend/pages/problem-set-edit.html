<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑题单 - NoldOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6" id="pageTitle">新建题单</h1>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 space-y-4">
      <div>
        <label for="psTitle" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">标题</label>
        <input id="psTitle" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white" placeholder="题单标题">
      </div>
      <div>
        <label for="psDesc" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">描述（Markdown）</label>
        <textarea id="psDesc" rows="4" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white font-mono text-sm" placeholder="题单描述..."></textarea>
      </div>
      <div class="flex items-center">
        <input id="psPublic" type="checkbox" checked class="w-4 h-4 text-indigo-600 rounded">
        <label for="psPublic" class="ml-2 text-sm text-gray-700 dark:text-gray-300">公开</label>
      </div>
      <div id="psVisibilityBox" class="hidden">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">可见性（仅管理员/超级管理员可设置）</label>
        <div class="flex items-center gap-4 mb-2">
          <label class="flex items-center gap-2"><input type="radio" name="psVisibility" value="public" checked onchange="syncVisibilityGroupsInput('psVisibility', 'psVisibilityGroups')" class="w-4 h-4 text-indigo-600 rounded"><span class="text-sm text-gray-700 dark:text-gray-300">公开</span></label>
          <label class="flex items-center gap-2"><input type="radio" name="psVisibility" value="groups" onchange="syncVisibilityGroupsInput('psVisibility', 'psVisibilityGroups')" class="w-4 h-4 text-indigo-600 rounded"><span class="text-sm text-gray-700 dark:text-gray-300">仅指定用户组</span></label>
        </div>
        <select id="psVisibilityGroups" multiple data-visibility-radio="psVisibility" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm dark:bg-gray-700 dark:text-white min-h-[80px]" aria-label="可见用户组（按住 Ctrl/Cmd 多选）"></select>
        <p class="text-xs text-gray-400 mt-1">与上方「公开」并列的新维度；选“仅指定用户组”时至少勾选一个组。</p>
      </div>
      <div>
        <label for="psProblems" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">题目列表（每行一个题目 ID）</label>
        <textarea id="psProblems" rows="6" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white font-mono text-sm" placeholder="1&#10;2&#10;3"></textarea>
        <p class="text-xs text-gray-400 mt-1">从上到下为题单中的顺序</p>
      </div>
      <div class="flex justify-between pt-4 border-t border-gray-100 dark:border-gray-700">
        <a href="/pages/problem-sets.html" class="px-4 py-2 text-gray-600 dark:text-gray-400 dark:text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-sm">返回</a>
        <div class="flex gap-2">
          <button id="delBtn" onclick="delSet()" class="hidden px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-semibold hover:bg-red-700" aria-label="删除此题单">删除</button>
          <button onclick="saveSet()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700" aria-label="保存题单">保存</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('problem-sets');
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('id');
    let existingSet = null;

    (async function init() {
      // 可见性控件仅 admin/su 可见；其他角色保存时不发 PUT，题单保持公开
      initVisibilityControl('psVisibilityBox', 'psVisibility', 'psVisibilityGroups');
      if (!sid) return;
      try {
        existingSet = await apiCall('GET', `/problem-sets/${sid}`);
        document.getElementById('pageTitle').textContent = `编辑题单 - ${existingSet.title}`;
        document.getElementById('psTitle').value = existingSet.title || '';
        document.getElementById('psDesc').value = existingSet.description || '';
        document.getElementById('psPublic').checked = !!existingSet.is_public;
        document.getElementById('psProblems').value = (existingSet.problems || []).map(p => p.id).join('\n');
        document.getElementById('delBtn').classList.remove('hidden');
        // 可见性回填（仅 admin/su）
        if (canManageVisibility()) {
          await loadEntityVisibility('problem-sets', sid, 'psVisibility', 'psVisibilityGroups');
        }
      } catch (err) {
        showToast(err.message || '加载题单失败', 'error');
        setTimeout(() => { window.location.href = '/pages/problem-sets.html'; }, 900);
      }
    })();

    async function saveSet() {
      const title = document.getElementById('psTitle').value.trim();
      if (!title) { showToast('请输入标题', 'error'); return; }
      const description = document.getElementById('psDesc').value;
      const is_public = document.getElementById('psPublic').checked ? 1 : 0;
      const problemIds = document.getElementById('psProblems').value
        .split('\n').map(s => parseInt(s.trim())).filter(n => n > 0);
      try {
        let setId = sid;
        if (sid) {
          await apiCall('PUT', `/problem-sets/${sid}`, { title, description, is_public });
          await apiCall('PUT', `/problem-sets/${sid}/problems`, { problemIds });
        } else {
          const created = await apiCall('POST', '/problem-sets', { title, description, is_public, problemIds });
          setId = created && created.id;
        }
        // 题单主数据已保存，再补可见性（失败仅 toast 提示「主数据已保存，可见性设置失败」，不回滚）
        let visFailed = false;
        if (setId) visFailed = !await saveEntityVisibility('problem-sets', setId, 'psVisibility', 'psVisibilityGroups');
        // 可见性没设成功时先停一下，让 toast 被看清再跳转
        if (canManageVisibility() && visFailed) await new Promise(r => setTimeout(r, 1800));
        window.location.href = `/pages/problem-set.html?id=${setId}`;
      } catch (err) { showToast(err.message || '保存失败', 'error'); }
    }

    async function delSet() {
      if (!sid || !confirm('确定删除此题单？')) return;
      try {
        await apiCall('DELETE', `/problem-sets/${sid}`);
        window.location.href = '/pages/problem-sets.html';
      } catch (err) { showToast(err.message || '删除失败', 'error'); }
    }
  </script>
</body>
</html>
