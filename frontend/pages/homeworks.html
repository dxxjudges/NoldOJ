<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业 - NoldOJ</title>
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">📚 作业</h1>
      <div id="createBtn"></div>
    </div>
    <div class="mb-4">
      <input id="searchInput" type="text" aria-label="搜索作业" placeholder="搜索作业..." class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none dark:bg-gray-800 dark:text-white" oninput="loadHomeworks(1)">
    </div>
    <div id="list" aria-live="polite" class="space-y-3">加载中...</div>
    <div id="pager" class="mt-6 flex justify-center gap-2"></div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('homeworks');
    const user = getUser();
    if (user && ['teacher', 'admin', 'su'].includes(user.role)) {
      document.getElementById('createBtn').innerHTML = '<a href="/pages/homework-edit.html" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700">+ 创建作业</a>';
    }

    let page = 1;
    function deadlineText(hw) {
      if (!hw.start_time && !hw.end_time) return '不限时';
      const fmt = (s) => s ? new Date(s).toLocaleString('zh-CN') : '—';
      return `${fmt(hw.start_time)} ~ ${fmt(hw.end_time)}`;
    }
    async function loadHomeworks(p) {
      page = p;
      const search = document.getElementById('searchInput').value;
      try {
        const data = await apiCall('GET', `/homeworks?page=${page}&limit=20&search=${encodeURIComponent(search)}`);
        if (!data.homeworks || data.homeworks.length === 0) {
          document.getElementById('list').innerHTML = '<p class="text-gray-400 text-center py-8">暂无作业</p>';
          document.getElementById('pager').innerHTML = '';
          return;
        }
        document.getElementById('list').innerHTML = data.homeworks.map(h => `
          <a href="/pages/homework.html?id=${h.id}" class="block bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-5 hover:shadow-md transition">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">${escapeHtml(h.title)}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${escapeHtml(h.description || '暂无描述')}</p>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0">
                ${h.is_hidden ? '<span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400">隐藏</span>' : ''}
                <span class="px-3 py-1 text-xs rounded-full ${h.is_public ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400'}">${h.is_public ? '公开' : '私有'}</span>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-4 mt-3 text-xs text-gray-400 dark:text-gray-500">
              <span>📝 ${h.question_count || 0} 题</span>
              <span>💯 总分 ${h.total_score || 0}</span>
              <span>👥 ${h.participant_count || 0} 人参与</span>
              <span>⏰ ${escapeHtml(deadlineText(h))}</span>
              <span>👤 ${escapeHtml(h.creator_name || '')}</span>
            </div>
          </a>
        `).join('');

        const totalPages = Math.ceil(data.total / 20) || 1;
        let ph = '';
        for (let i = 1; i <= totalPages; i++) {
          ph += `<button onclick="loadHomeworks(${i})"${i === page ? ' aria-current="page"' : ''} class="px-3 py-1 text-sm rounded-lg ${i === page ? 'bg-indigo-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700'}">${i}</button>`;
        }
        document.getElementById('pager').innerHTML = ph;
      } catch (err) {
        document.getElementById('list').innerHTML = `<p class="text-red-500 text-center py-8">${escapeHtml(err.message) || '加载失败'}</p>`;
      }
    }
    loadHomeworks(1);
  </script>
</body>
</html>
